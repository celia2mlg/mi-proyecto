<mat-card appearance="outlined">
    <mat-card-content>


        <form [formGroup]="formulario">
            <div class="example-container">
                <mat-form-field>
                    <mat-label>Email</mat-label>
                        <input
                            matInput
                            formControlName="email"
                            required
                        />
                    </mat-form-field>
                </div>
                <div class="example-container">
                    <mat-form-field>
                  
                        <mat-label>Contraseña</mat-label>
                            <input type="password"
                                matInput
                                formControlName="password"
                                required  
                            />
                        </mat-form-field>
                    </div>
                    <p class="registrarse" (click)="navigateToRegister()">¿No tienes cuenta? Registrate</p>
                    <div class="submit">
                            <button class="botonSubmit" [disabled]="formulario.invalid"   (click)="login()" mat-button>Iniciar sesion</button>
                    </div>                  
            </form>        
    </mat-card-content>
  </mat-card>
