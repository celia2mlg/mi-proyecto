<div class="page">
  <mat-card appearance="outlined">
    <mat-card-content>
      <form [formGroup]="formulario">
        <div class="example-container">
          <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" required />
          </mat-form-field>
        </div>
        <div class="example-container">
          <mat-form-field>
            <mat-label>Contraseña</mat-label>
            @if (!showPassword) {
              <input
                type="password"
                matInput
                formControlName="password"
                required
              />
            } @else {
              <input matInput type="text" formControlName="password" required />
            }
            <button
              mat-icon-button
              matSuffix
              (click)="togglePasswordVisibility()"
              tabindex="-1"
            >
              @if (!showPassword) {
                <mat-icon>visibility_off</mat-icon>
              } @else {
                <mat-icon>visibility</mat-icon>
              }
            </button>
          </mat-form-field>
        </div>
        <p (click)="navigateToRegister()">¿No tienes cuenta? Registrate</p>
        @if (this.errorMsg) {
          <p style="color: red; text-decoration: none; cursor: default">
            {{ this.errorMsg }}
          </p>
        }
        <div class="submit">
          <button
            class="botonSubmit"
            [disabled]="formulario.invalid"
            (click)="login()"
            mat-button
          >
            Iniciar sesion
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
